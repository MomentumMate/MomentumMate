name: Diagnos av tickers

# Manuell diagnos: vad EODHD och Yahoo säger om angivna tickers (senaste datum, EODHD:s sökförslag). Ändrar ingenting.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, kommaseparerade (Yahoo-form), t.ex. AHT.L,ROG.SW – eller tomt"
        required: false
      sec:
        description: "Förvaltare (CIK eller namn) – listar alla 13F-filings hos SEC"
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - if: github.event.inputs.tickers != ''
        run: python scanner.py --probe "$TICKERS"
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
      - if: github.event.inputs.sec != ''
        run: python radar.py --filings "$SEC"
        env:
          SEC: ${{ github.event.inputs.sec }}
          RADAR_CONTACT: ${{ secrets.RADAR_CONTACT }}
