name: Daily momentum scan

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 13:00/14:00 svensk tid, helgfri mån–fre, före USA-öppning
  workflow_dispatch:          # gör att du kan köra den manuellt via "Run workflow"-knappen

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scanner.py
        env:
          BENZINGA_KEY: ${{ secrets.BENZINGA_KEY }}   # lämna secreten tom om du inte har någon

      - name: Commit data.json
        run: |
          git config user.name "momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Daglig uppdatering $(date -u +%F)"
          git push
