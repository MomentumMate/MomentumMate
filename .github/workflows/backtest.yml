name: Backtest

# Validerar den tekniska kärnan i modellen mot historisk data.
# Körs manuellt (Actions -> Backtest -> Run workflow) och en gång i månaden.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Antal år att testa"
        default: "10"
      quick:
        description: "Bara grundfallet (snabbare)"
        type: boolean
        default: false
      combo:
        description: "Testa kombinationer i stället för en ändring i taget"
        type: boolean
        default: false
      robust:
        description: "Robusthetstest: delar perioden och marknaderna"
        type: boolean
        default: false
      exits:
        description: "Utgångstest: vilken utgång låter vinnarna löpa längst"
        type: boolean
        default: false
      vix:
        description: "VIX-test: skyddar volatilitetsfiltret mot momentumkrascher"
        type: boolean
        default: false
      vixindex:
        description: "Volatilitetsindex: ^VIX (USA), ^VXN (Nasdaq) eller ^V2TX (Europa)"
        default: "^VIX"
      entry:
        description: "Entry-test: verkliga kostnader, poststorlek och rekyltajming"
        type: boolean
        default: false
      mix:
        description: "Mix-test: bästa kombination av antal, marknad och hålltid för portföljstorleken"
        type: boolean
        default: false
      freq:
        description: "Frekvenstest: hur ofta lönar det sig att handla?"
        type: boolean
        default: false
      conc:
        description: "Koncentration: få innehav som får löpa tills momentum tar slut"
        type: boolean
        default: false
      decay:
        description: "Försämring: volymbalans, ATH-avstånd och lägre toppar"
        type: boolean
        default: false
      tp:
        description: "Vinstmål: kapar appens tp=35/halva regeln vinnarna?"
        type: boolean
        default: false
      score:
        description: "Poängmodell: är appens formel bättre än den validerade?"
        type: boolean
        default: false
      srstop:
        description: "Stopp vid stöd: nivåbaserat stopp mot fast 15 %"
        type: boolean
        default: false
      momwin:
        description: "Momentumfönster: 12-1 mot 6-1, blandat, viktat"
        type: boolean
        default: false
      core:
        description: "Kärnlager: absoluta hållvillkor, månadsprövning, brusfilter"
        type: boolean
        default: false
      port:
        description: "Portföljstorlek i kronor (styr poststorlek och därmed minimicourtaget)"
        default: "10000000"
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kör backtest
        env:
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
        run: |
          python backtest.py --years "${{ github.event.inputs.years || 10 }}" \
            ${{ github.event.inputs.quick == 'true' && '--quick' || '' }} \
            ${{ github.event.inputs.combo == 'true' && '--combo' || '' }} \
            ${{ github.event.inputs.robust == 'true' && '--robust' || '' }} \
            ${{ github.event.inputs.exits == 'true' && '--exits' || '' }} \
            ${{ github.event.inputs.vix == 'true' && format('--vix --vixindex {0}', github.event.inputs.vixindex || '^VIX') || '' }} \
            ${{ github.event.inputs.entry == 'true' && format('--entry --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.mix == 'true' && format('--mix --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.freq == 'true' && format('--freq --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.conc == 'true' && format('--conc --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.decay == 'true' && format('--decay --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.tp == 'true' && format('--tp --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.score == 'true' && format('--score --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.srstop == 'true' && format('--srstop --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.momwin == 'true' && format('--momwin --port {0}', github.event.inputs.port || '10000000') || '' }} \
            ${{ github.event.inputs.core == 'true' && format('--core --port {0}', github.event.inputs.port || '10000000') || '' }} \
            --out backtest.json 2>&1 | tee backtest.log
      - name: Publicera resultatet på grenen backtest
        run: |
          [ -f backtest.json ] || exit 0
          mkdir /tmp/bt && cp backtest.json backtest.log /tmp/bt/ && cd /tmp/bt
          git init -q -b backtest
          git config user.name "momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "backtest $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin backtest
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            backtest.json
            backtest.log
