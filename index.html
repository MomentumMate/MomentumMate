<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8"><title>MomentumMate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="MomentumMate"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#000;--card:#0f0d09;--tx:#f8f3e8;--mu:#a3977f;--bd:#2b2314;--ac:#e8b64a;--gd:#ffd166;--up:#7ddc9b;--dn:#f0846f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(110% 50% at 85% -8%,#3a2a0a 0,transparent 62%),#000;background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:640px;margin:auto;padding:0 14px 110px}
small,.mu{color:var(--mu);font-size:12px}
a{color:inherit}
.up{color:var(--up)}.dn{color:var(--dn)}
[data-go],[data-act],[data-i]{cursor:pointer}
/* topbar */
.top{display:flex;align-items:center;gap:10px;padding:14px 2px 10px}
.top .ttl{flex:1;font-weight:700;font-size:20px}
.brand b{color:var(--gd)}
.back{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--gd);display:grid;place-items:center;font-size:22px;text-decoration:none;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#b8862b,#ffd98a);display:grid;place-items:center;font-weight:700;color:#1a1200;font-size:13px;flex:none}
/* moduler */
.mod{background:linear-gradient(180deg,#14100a,#0b0905);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;display:block}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mh .ico{width:36px;height:36px;border-radius:12px;background:#1b1508;display:grid;place-items:center;color:var(--gd);font-size:18px}
.mh h2{margin:0;font-size:13px;letter-spacing:1.8px;color:var(--gd);flex:1}
.mh .go{color:var(--mu);font-size:22px;line-height:1}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.pill{font-size:12px;background:#2a2010;color:var(--gd);padding:3px 9px;border-radius:99px;margin-left:8px;font-weight:600;letter-spacing:0;vertical-align:middle}
.pill.up{color:var(--up)}.pill.dn{color:var(--dn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:99px;font-size:13px;white-space:nowrap;flex:none}
.chip.on{border-color:var(--gd);color:var(--gd);font-weight:600}
.sr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1a160d}
.sr:last-child{border-bottom:0}
.sr .m{flex:1;min-width:0}.sr .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{text-align:right;flex:none}
/* sök */
.srch{display:flex;align-items:center;gap:8px;background:#17130b;border:1px solid var(--bd);border-radius:14px;padding:0 12px;color:var(--gd)}
.srch input{border:0;background:none;padding:13px 0;outline:none}
/* nyhetsticker */
.tk{height:124px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.tk .in{will-change:transform}
.tl{padding:6px 0;font-size:13.5px;line-height:1.3;border-bottom:1px solid #1a160d}
.nt{display:inline-block;font-size:10.5px;font-weight:700;color:#1a1200;background:linear-gradient(135deg,#d4a537,#ffd166);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.nw{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.nh{font-weight:600;font-size:15px;line-height:1.3}
.ns{color:var(--mu);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm{color:var(--mu);font-size:11.5px;margin-top:6px}
/* kort */
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;margin-bottom:8px;overflow:hidden}
.r{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.n{width:28px;min-width:28px;height:28px;border-radius:8px;background:#17130b;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gd)}
.n.w{width:40px;min-width:40px;font-size:12px}
.c.t3 .n{background:linear-gradient(135deg,#b8862b,#ffd166);color:#1a1200}
.m{flex:1;min-width:0}.m b{font-size:16px}.m>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{width:64px;height:26px;flex:none}
.bar{height:4px;background:var(--bd)}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a12,#ffd166)}
.tag{background:linear-gradient(135deg,#d4a537,#ffd166);color:#1a1200;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:6px}
.d{display:none;padding:0 12px 12px;border-top:1px solid var(--bd)}.c.o .d{display:block}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.g div{background:#17130b;border-radius:8px;padding:6px 8px}.g b{display:block;font-size:14px}
h4{margin:12px 0 4px;font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:.5px}
h4[data-i]{cursor:pointer}
.k{font-size:13px;padding:2px 0}
.news{display:block;font-size:13px;padding:6px 0;border-bottom:1px solid #1a160d;color:var(--tx);text-decoration:none}
.al{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.al2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 12px 10px 50px}.al2 .sig{margin:0}
.ab{font-size:10.5px;padding:2px 7px;border-radius:7px;background:#1b1710;border:1px solid var(--bd);color:var(--mu);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ab.graham,.ab.magic{color:var(--gd);border-color:#5a4418}
.hz{font-size:10.5px;padding:2px 7px;border-radius:7px;border:1px solid;white-space:nowrap;font-weight:600}
.sig{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-left:6px;vertical-align:2px}
.sig.SELL{background:#4a1d16;color:#ffb4a3}.sig.TRIM{background:#4a3513;color:#ffd166}.sig.BUY{background:#143a24;color:#7ddc9b}
.sig.WATCH{border:1px solid #6a5420;color:var(--gd)}.sig.HOLD,.sig.NA{background:#1b1710;color:var(--mu)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* tabbar / knappar */
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--bd);margin:10px 0}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:10px;font-weight:600;font-size:13px;font-family:inherit}
.tabs button.on{background:linear-gradient(135deg,#b8862b,#ffd166);color:#1a1200}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;color:#1a1200;background:linear-gradient(135deg,#d4a537,#ffd166);font-family:inherit;cursor:pointer}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:#17130b;color:var(--gd);border:1px solid var(--bd)}
.btn.dn{background:#3a1a14;color:#ffb4a3;border:1px solid #5a2a20}
.wide{width:100%}
/* hero (börsvy) */
.hero{background:linear-gradient(180deg,#1a1408,#0a0805);border:1px solid var(--bd);border-radius:18px;margin-top:8px;padding:8px 10px 6px;position:relative}
.hero svg{width:100%;height:54px;display:block;filter:drop-shadow(0 0 7px #e8b64a99)}
.ax{display:flex;justify-content:space-between;padding:2px 6px 0}
.ii{color:var(--ac);font-size:15px;margin-left:6px;font-weight:400;vertical-align:super}
.trc{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:10px 0}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(from 0deg,#8a5a12,#ffd166 calc(var(--p)*1%),#2b2314 0);display:grid;place-items:center;box-shadow:0 0 24px #e8b64a44;position:relative;flex:none}
.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}.ring b{position:relative;z-index:1;font-size:20px}
/* portfölj */
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 8px;background:var(--bd)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.kv div{background:#17130b;border-radius:10px;padding:8px 10px}.kv b{display:block;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* formulär */
.fld{display:block;margin:0 0 10px}.fld>span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;background:#17130b;border:1px solid var(--bd);border-radius:12px;padding:12px;color:var(--tx);font-size:16px;font-family:inherit}
textarea{min-height:110px;font-size:12px}
.srch input{border:0;background:none;padding:13px 0}
.banner{background:#2a2010;color:var(--gd);padding:9px 12px;border-radius:12px;font-size:12px;margin:0 0 12px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#000000ee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav a{flex:1;color:var(--mu);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;cursor:pointer}
nav a.on{color:var(--gd)}nav a.on svg{filter:drop-shadow(0 0 5px #e8b64a)}
/* sheet */
#sh{position:fixed;inset:0;z-index:40;visibility:hidden;transition:visibility .3s}#sh.on{visibility:visible}
#sh .bk{position:absolute;inset:0;background:#000b;opacity:0;transition:opacity .25s}#sh.on .bk{opacity:1}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:auto;max-height:88vh;overflow:auto;background:#14110b;border:1px solid var(--bd);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 22px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px #e8b64a22}
#sh.on .pn{transform:none}
#sh .gr{width:44px;height:5px;border-radius:9px;background:#3a3226;margin:0 auto 16px}
#sh h3{margin:0 0 8px;color:var(--gd);font-size:19px}#sh p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#1b1508;border:1px solid #5a4418;color:var(--gd);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(90% 45% at 78% 12%,#3a2a0a 0,transparent 65%),#000;transition:opacity .55s;overflow:hidden}
#intro svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 16px #e8b64a66)}
#intro .word{position:absolute;right:26px;bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:26px;font-weight:700;letter-spacing:-.4px;opacity:0;transition:opacity .6s}
#intro .word b{color:var(--gd)}#intro .word.on{opacity:1}
#intro.gone{opacity:0;pointer-events:none}
.about{background:#17130b;border:1px solid #241d10;border-radius:12px;padding:9px 11px;margin:10px 0 4px}
.about .fc{font-size:11.5px;line-height:1.35}.about .abt{font-size:13px;line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sumx{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 14px;margin:8px 0}
.sumx .sx-l{min-width:0}.sumx .sx-r{flex:none;text-align:center;cursor:pointer}.sumx .ring{width:72px;height:72px;margin:0 auto}.sumx .ring b{font-size:17px}.sumx .ring:after{inset:8px}
.chip.mk{padding:5px 6px;gap:3px}.chips.mkrow{flex-wrap:wrap;gap:5px}
.fg{font-size:13px;margin-right:4px;vertical-align:-1px}
.gb{font-size:12px;margin-left:6px;background:#1b1508;border:1px solid var(--bd);border-radius:7px;padding:1px 6px;vertical-align:1px;cursor:pointer}
.mkm.cmp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.mkm .dh{width:36px;height:36px;display:grid;place-items:center;font-size:24px;color:var(--gd);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mkm .ico2{font-size:24px}.mkm.drag{position:relative;z-index:6;box-shadow:0 8px 30px #000a,0 0 0 1px var(--gd);background:#1b1508}
details.nwd summary{cursor:pointer;list-style:none;font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;font-weight:700}
details.nwd summary::-webkit-details-marker{display:none}details.nwd summary:after{content:" ▾"}details.nwd[open] summary:after{content:" ▴"}
.pla{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:8px;font-size:11.5px;font-weight:700}
.pla.S{background:#3a1a14;color:#f0846f}.pla.B{background:#143a24;color:#7ddc9b}.pla.H{background:#2a2410;color:var(--gd)}
.plr.done{opacity:.5}.plr .btn.sm{padding:6px 10px}
.tlk{color:var(--gd);text-decoration:underline;text-decoration-color:#e8b64a66;cursor:pointer}
.pfrow{flex-wrap:wrap;gap:6px}
.pfc{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pfc.dragc{position:relative;z-index:8;box-shadow:0 6px 22px #000a,0 0 0 1px var(--gd);background:#1b1508}
.nw.hl{border-color:var(--gd)!important;box-shadow:0 0 0 1px var(--gd)}
.srt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
/* ---- v3 ---- */
.top .gear{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--gd);display:grid;place-items:center;font-size:17px;flex:none;cursor:pointer}
.sig.WAIT{background:#1b1710;color:var(--mu)}
.stat .k b,.stat .mu b,.stat .k span{display:inline;font-size:inherit;letter-spacing:0;color:var(--tx);margin:0}
.sig.INPOS{border:1px solid #6a5420;color:var(--gd)}
.chart{width:100%;display:block;background:#0a0805;border:1px solid var(--bd);border-radius:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mu);margin:8px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stat{border-radius:14px;padding:12px 14px;margin:10px 0;border:1px solid var(--bd);background:var(--card);font-size:14px}
.stat.BUY{border-color:#2d6a45;background:#0f2418}.stat.SELL{border-color:#7a3426;background:#2a130e}.stat.HOLD{border-color:#6a5420;background:#1d170a}
.stat b{display:block;font-size:12px;letter-spacing:1.4px;color:var(--gd);margin-bottom:3px}
.stat.BUY b{color:var(--up)}.stat.SELL b{color:var(--dn)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.plan div{background:#17130b;border-radius:10px;padding:8px 10px}.plan b{display:block;font-size:15px}
.plan .sl b{color:var(--dn)}.plan .tg b{color:var(--up)}.plan .en b{color:var(--gd)}
.fl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;border-bottom:1px solid #1a160d}
.fl em{font-style:normal;font-weight:700;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;flex:none}
.fl em.B{background:#143a24;color:var(--up)}.fl em.S{background:#4a1d16;color:#ffb4a3}
/* mate */
#mate{position:fixed;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2a2010,#0b0905);border:1px solid #5a4418;box-shadow:0 0 20px #e8b64a44;z-index:30;display:grid;place-items:center;cursor:pointer;padding:0}
#mb{position:fixed;right:12px;bottom:calc(144px + env(safe-area-inset-bottom,0px));max-width:min(310px,calc(100vw - 24px));background:#17120a;border:1px solid #6a5420;border-radius:16px 16px 4px 16px;padding:11px 13px;font-size:13.5px;line-height:1.38;z-index:30;box-shadow:0 8px 30px #000a;opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;transition:opacity .25s,transform .25s}
#mb.on{opacity:1;transform:none;pointer-events:auto}
#mb.alert{border-color:#ffd166;box-shadow:0 0 22px #ffd16655,0 8px 30px #000a}
#mb .x{float:right;margin:-6px -4px 0 10px;color:var(--mu);font-size:20px;cursor:pointer;line-height:1}
#mb .more{display:inline-block;margin-top:6px;color:var(--gd);font-weight:700;font-size:12.5px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto;margin-bottom:10px}
.bub{background:#1b160c;border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:14px;line-height:1.4;align-self:flex-start;max-width:94%}
.bub.me{align-self:flex-end;background:#2a2010;border-radius:14px 14px 4px 14px}
.lnk{color:var(--gd);font-weight:600;cursor:pointer;white-space:nowrap}
.imp td,.imp th{font-size:11px;padding:3px 5px;border-bottom:1px solid #1a160d;text-align:left;white-space:nowrap}.imp{border-collapse:collapse;width:100%}
.ovx{overflow-x:auto;margin:6px 0 10px}
select.sm{padding:8px;font-size:14px}
nav a{min-width:0}nav a svg{width:21px;height:21px}

</style></head><body>

<script>
const DATA_URL="data.json";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=(n,d=2)=>n==null||isNaN(n)?"–":Number(n).toFixed(d);
const sg=(n,d=2)=>n==null||isNaN(n)?"–":(n>=0?"+":"")+Number(n).toFixed(d)+"%";
const cls=n=>(n||0)>=0?"up":"dn";
const kr=n=>Math.round(n).toLocaleString("sv-SE");
const todayISO=()=>new Date().toISOString().slice(0,10);
const ago=ts=>{if(!ts)return"";const s=Date.now()/1000-ts;if(s<3600)return Math.max(1,Math.round(s/60))+" min";if(s<86400)return Math.round(s/3600)+" tim";return Math.round(s/86400)+" d"};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const HZ={"1-3":["1–3 mån","#ffd166"],"3-6":["3–6 mån","#e8b64a"],"6-12":["6–12 mån","#d09a3a"],"12-24":["1–2 år","#b08a4a"],"24+":["2+ år","#a09070"],none:["Avvakta","#7a7262"]};
const hz=h=>{const x=HZ[h]||HZ.none;return `<span class="hz" style="color:${x[1]};border-color:${x[1]}66">${x[0]}</span>`};
const SIGL={SELL:"SÄLJ",TRIM:"OMFÖRDELA",WATCH:"BEVAKA",BUY:"KÖP MER",HOLD:"BEHÅLL",NA:"–"};
const ic=k=>({sma50:"📈 ",rsi:"⚡ ",fib:"📐 ",graham:"🛡️ ",magic:"✨ "}[k]||"• ");
const shortA=a=>({sma50:a.t.includes("upp")?"SMA50 ↑":"SMA50 ↓",rsi:a.t.includes("över")?"RSI hög":"RSI låg",fib:"Fibonacci",graham:"Graham",magic:"Magic Formula"}[a.k]||a.t);

/* ---------- DATA ---------- */
let D=null,S={},SL=[],DEMO=false,OLD=false,H={};
const Ui={tab:{},dt:false,shown:{},news:"all"},open=new Set();
const MK=k=>(D.markets.find(m=>m.k===k))||{n:k,flag:"",cur:""};
const fx=c=>(D.fx&&D.fx[c])||({SEK:1,USD:10.5,EUR:11.5}[c]||1);
function indexData(){S=D.stocks;SL=Object.values(S);SL.forEach(s=>{s._k=norm(s.d+" "+s.n+" "+s.t)})}
async function loadData(){
  try{const r=await fetch(DATA_URL+"?t="+Date.now());if(!r.ok)throw 0;const j=await r.json();if(!j.stocks)throw "old";return{d:j,demo:false,old:false}}
  catch(e){return{d:demo(),demo:true,old:e==="old"}}
}

/* ---------- PORTFÖLJER (sparas i webbläsaren) ---------- */
const APPV="2026-10-08-a";
const LS="mm_portfolios_v1";
let P=(()=>{try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.ps)return j}catch(e){}return{ps:[],cur:null,snap:{}}})();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const getP=id=>P.ps.find(p=>p.id===id);
function addHolding(p,t,q,c,d,ex){const h=p.h.find(x=>x.t===t);if(h){const nq=h.q+q;h.c=(h.q*h.c+q*c)/nq;h.q=nq;if(d<h.d)h.d=d}else p.h.push(Object.assign({t,q,c,d},ex||{}));p.tx.unshift({k:"buy",t,q,px:c,d});p.tx=p.tx.slice(0,100)}
function sellHolding(p,t,q,px,d){const h=p.h.find(x=>x.t===t);if(!h)return;q=Math.min(q,h.q);const s=S[t];p.re=(p.re||0)+(px-h.c)*q*fx(s?s.ccy:(h.ccy||"SEK"));h.q-=q;if(h.q<=1e-9)p.h=p.h.filter(x=>x!==h);p.tx.unshift({k:"sell",t,q,px,d});p.tx=p.tx.slice(0,100)}
function signal(r,n){
  const s=r.s;if(!s)return{k:"NA",why:["Ingen live-data för den här aktien. Lägg tickern i extra_tickers.txt så tas den med nästa körning."]};
  const sell=[],buy=[],trim=[],stretch=[],take=[];
  if(!s.a200&&!s.sh)sell.push("Under SMA200 – den långsiktiga trenden är bruten");
  if(!s.a50&&s.macd<0)sell.push("Under SMA50 och MACD pekar nedåt");
  if(s.rsi>78)stretch.push("RSI "+s.rsi+" – kraftigt överköpt (kan backa kortsiktigt, trenden är inte bruten)");
  if(s.sc<35)sell.push("Låg momentumpoäng ("+s.sc+")");
  if(s.r1m!=null&&s.r1m<-10)sell.push("Tappat "+f(Math.abs(s.r1m),1)+"% senaste månaden");
  if(r.ret<-12&&!s.a50)sell.push("Förlust "+f(r.ret,1)+"% sedan inköp och under SMA50");
  if(r.ret>40&&s.rsi>70)take.push("Vinst +"+f(r.ret,1)+"% med överköpt RSI – överväg att ta hem delar av vinsten");
  if(s.eg!=null&&s.eg<-20&&s.rg!=null&&s.rg<0)sell.push("Fallande vinst och omsättning");
  if(r.w>30&&n>=3)trim.push("Övervikt: "+f(r.w,0)+"% av portföljen");
  if(s.sc>=70)buy.push("Hög momentumpoäng ("+s.sc+")");
  if(s.a50&&s.a200&&s.rsi<65)buy.push("Trend över SMA50/200 och RSI "+s.rsi+" (inte överköpt)");
  if(s.al.some(a=>a.k==="fib")&&s.a200)buy.push("Pris vid Fibonacci-nivå i upptrend");
  if(s.rsi<32&&s.a200)buy.push("RSI översåld i långsiktig upptrend");
  if(s.gr||s.mf)buy.push((s.gr&&s.mf?"Graham och Magic Formula":s.gr?"Graham Screener":"Magic Formula")+"-kandidat");
  if(s.eg>10&&s.rg>5)buy.push("Växande vinst och omsättning");
  let k="HOLD",why=[];
  if(sell.length>=2){k="SELL";why=sell.concat(stretch,take)}
  else if(trim.length||take.length){k="TRIM";why=trim.concat(take,sell,stretch)}
  else if(sell.length===1||stretch.length){k="WATCH";why=sell.concat(stretch)}
  else if(buy.length>=3){k="BUY";why=buy}
  else why=buy.length?["Inga varningssignaler. Positivt: "+buy.join("; ")]:["Inga tydliga signaler – behåll."];
  return{k,why}
}
function calc(p){
  const rows=p.h.map(h=>{const s=S[h.t],px=s&&s.px>0?s.px:(h.lp>0?h.lp:h.c),F=fx(s?s.ccy:(h.ccy||"SEK")),val=h.q*px*F,cost=h.q*h.c*F,prev=s?px/(1+s.chg/100):px;
    return{h,s,px,F,val,cost,pnl:val-cost,ret:(px/h.c-1)*100,day:h.q*(px-prev)*F,hl:health(h)}});
  const tot=rows.reduce((a,r)=>a+r.val,0),cost=rows.reduce((a,r)=>a+r.cost,0),day=rows.reduce((a,r)=>a+r.day,0);
  rows.forEach(r=>{r.w=tot?r.val/tot*100:0});
  rows.forEach(r=>{r.sig=signal(r,rows.length)});
  rows.sort((a,b)=>b.val-a.val);
  return{rows,tot,cost,pnl:tot-cost,day,dayPct:(tot-day)?day/(tot-day)*100:0,ret:cost?(tot/cost-1)*100:0}
}
function snapshot(){let ch=false;P.snap=P.snap||{};P.ps.forEach(p=>{if(!p.h.length)return;const v=Math.round(calc(p).tot),a=P.snap[p.id]=P.snap[p.id]||[],t=todayISO();if(a.length&&a[a.length-1][0]===t){if(a[a.length-1][1]!==v){a[a.length-1][1]=v;ch=true}}else{a.push([t,v]);if(a.length>400)a.shift();ch=true}});if(ch)save()}
function allTotals(){let tot=0,day=0,n=0,sg2={SELL:0,TRIM:0,BUY:0,WATCH:0};P.ps.forEach(p=>{const c=calc(p);tot+=c.tot;day+=c.day;n+=p.h.length;c.rows.forEach(r=>{if(sg2[r.sig.k]!=null)sg2[r.sig.k]++})});return{tot,day,n,sg:sg2,dp:(tot-day)?day/(tot-day)*100:0}}

/* ---------- NYHETER ---------- */
function feed(scope){
  const mom=new Set(),port=new Set();
  D.markets.forEach(m=>{const r=D.rank[m.k];if(r)r.mom.slice(0,10).forEach(t=>mom.add(t))});
  P.ps.forEach(p=>p.h.forEach(h=>port.add(h.t)));
  const src=[],add=(set,tag)=>set.forEach(t=>(D.news[t]||[]).forEach(n=>src.push(Object.assign({},n,{t,tag}))));
  if(scope==="mom"||scope==="all"||scope==="home")add(mom,"mom");
  if(scope==="port"||scope==="all"||scope==="home")add(port,"port");
  if(scope==="mkt"||scope==="all"||(scope==="home"&&src.length<8))(D.feed||[]).forEach(n=>src.push(Object.assign({},n,{tag:"mkt"})));
  const seen=new Set(),out=[];
  src.sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(n=>{const k=n.u||n.h;if(seen.has(k))return;seen.add(k);out.push(n)});
  return out
}
function newsDiag(){
  if(DEMO)return"Inga nyheter ännu.";const st=D.stats;
  if(!st)return"Inga nyheter i datan ännu. Kör “Daily momentum scan” med den senaste scanner.py så hämtas nyheter.";
  return`Inga nyheter hämtades vid senaste körningen: ${st.news_tickers||0} av ${st.ok} aktier fick nyheter (Yahoo ${st.news_yahoo||0}, reserv ${st.news_fallback||0}) och ${st.feed_items||0} marknadsartiklar.${st.news_last_err?" Senaste fel: "+st.news_last_err+".":""} Se raden som börjar med “Nyheter:” i loggen (Actions → Run python scanner.py).`
}
const tchip=n=>n.t&&S[n.t]?`<span class="nt" data-go="#/stock/${encodeURIComponent(n.t)}">${esc(S[n.t].d)}</span>`:"";
const nid=n=>{let h=5381;const k=String(n.u||n.h);for(let i=0;i<k.length;i++)h=((h<<5)+h+k.charCodeAt(i))|0;return(h>>>0).toString(36)};
const nitem=n=>`<a class="nw" id="n-${nid(n)}" ${n.u?`href="${esc(n.u)}" target="_blank" rel="noopener"`:""}><div class="nh">${esc(n.h)}</div>${n.s?`<div class="ns">${esc(n.s)}</div>`:""}<div class="nm">${tchip(n)}${esc(n.src||"")}${n.ts?" · "+ago(n.ts):""}</div></a>`;
function newsList(t){const a=(D.news[t]||[]).slice().sort((x,y)=>(y.ts||0)-(x.ts||0));if(!a.length)return'<div class="mu">Inga nyheter</div>';return a.map(n=>`<a class="news" ${n.u?`href="${esc(n.u)}" target="_blank" rel="noopener"`:""}>${esc(n.h)} <span class="mu">– ${esc(n.src||"")}${n.ts?" · "+ago(n.ts):""}</span></a>`).join("")}

/* ---------- SÖK ---------- */
function search(q,lim=20){q=norm(q).trim();if(!q)return[];const out=[];SL.forEach(s=>{const d=norm(s.d);let sc=0;if(d===q)sc=100;else if(d.startsWith(q))sc=80;else if(s._k.indexOf(" "+q)>=0)sc=60;else if(s._k.indexOf(q)>=0)sc=40;if(sc)out.push([sc+(s.sc||0)/100,s])});out.sort((a,b)=>b[0]-a[0]);return out.slice(0,lim).map(x=>x[1])}
const srow=s=>`<div class="sr" data-go="#/stock/${encodeURIComponent(s.t)}"><div class="m"><div>${fl(s)}<b>${esc(s.d)}</b> ${hz(s.h)}</div><div class="mu">${esc(s.n)} · ${s.m.map(k=>esc(MK(k).n)).join(", ")}</div></div><div class="p"><b>${s.px} ${s.cur}</b><div class="${cls(s.chg)}">${sg(s.chg)}</div></div><button class="btn sm" data-act="add" data-t="${esc(s.t)}" aria-label="Lägg till i portfölj">+</button></div>`;


/* ---------- SMÅ KOMPONENTER ---------- */
function spark(a,w=64,h=26){if(!a||a.length<2)return`<svg class="sp" viewBox="0 0 ${w} ${h}"></svg>`;const mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;const pts=a.map((v,i)=>(i/(a.length-1)*(w-2)+1).toFixed(1)+","+(h-2-(v-mn)/r*(h-4)).toFixed(1)).join(" ");return`<svg class="sp" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${a[a.length-1]>=a[0]?"#e8b64a":"#f0846f"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function heroSvg(L){const n=L.length;if(n<2)return"";const r=[...L].reverse(),mn=Math.min(...r.map(x=>x.sc))-2,mx=Math.max(...r.map(x=>x.sc))+2;const Q=r.map((x,i)=>[i/(n-1)*290+5,46-(x.sc-mn)/(mx-mn)*38]);let d="M"+Q[0];for(let i=1;i<n;i++){const m=(Q[i-1][0]+Q[i][0])/2;d+=`C${m},${Q[i-1][1]} ${m},${Q[i][1]} ${Q[i]}`}return`<svg viewBox="0 0 300 54" preserveAspectRatio="none"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#8a5a12"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs><path d="${d}" fill="none" stroke="url(#gg)" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${Q[n-1][0]}" cy="${Q[n-1][1]}" r="5" fill="#ffe7a8"/></svg>`}
const alerts=s=>s.al&&s.al.length?`<div class="al">${s.al.slice(0,2).map(a=>`<span class="ab ${a.k}">${ic(a.k)}${shortA(a)}</span>`).join("")}${s.al.length>2?`<span class="ab">+${s.al.length-2}</span>`:""}</div>`:"";

const coName=s=>(!s.n||s.n===s.t||s.n===s.d)?'<span style="font-style:italic;opacity:.7">Namn saknas från Yahoo</span>':esc(s.n);
function card(s,i,o={}){
  const val=o.val,sc=val?((s.vs&&s.vs[o.mk])||0):s.sc;
  const sub=val?`P/E ${s.pe??"–"} · P/B ${s.pb??"–"} · Graham ${s.grn}/6`:`RSI ${s.rsi} · vol ${s.vx}×`;
  return`<div class="c${open.has(s.t)?" o":""}${i<=3&&!o.compact?" t3":""}" data-t="${esc(s.t)}"><div class="r"><div class="n">${i}</div>
  <div class="m"><div>${fl(s)}<b>${esc(s.d)}</b><span class="gb" data-act="chart" data-t="${esc(s.t)}" aria-label="Graf">📈</span>${s.dok?'<span class="tag">DAGHANDEL</span>':""}</div><div class="mu">${coName(s)}</div><div class="mu">${sub}</div></div>
  ${spark(s.sp)}<div class="p"><b>${s.px} ${s.cur}</b><div class="${cls(s.chg)}">${sg(s.chg)}</div></div></div>
  <div class="al2">${hz(s.h)}${s.al.slice(0,2).map(a=>`<span class="ab ${a.k}">${ic(a.k)}${shortA(a)}</span>`).join("")}${s.al.length>2?`<span class="ab">+${s.al.length-2}</span>`:""}</div>
  <div class="bar"><i style="width:${Math.min(100,sc)}%"></i></div>${detail(s,o.mk)}</div>`
}
function detail(s,mk,extra=""){
  const crit=["Pris över gårdagens high","Gårdagens stängning över SMA200","Pris över pre-market high","Pris över dagens öppning","Pre-market volym ≥ 50K"];
  const n=s.dt.filter(x=>x===true).length,na=s.dt.some(x=>x==null);
  const mfp=(s.mfr&&(s.mfr[mk]!=null?s.mfr[mk]:s.mfr[s.m[0]]));
  return`<div class="d">${aboutHTML(s)}<div class="g"><div><small>Momentumpoäng</small><b>${s.sc}</b></div><div><small>52L</small><b>${f52(s,"lo")}</b></div><div><small>52H</small><b>${f52(s,"hi")}</b></div>
  <div><small>Vinst-tillv.</small><b>${s.eg==null?"–":s.eg+"%"}</b></div><div><small>Omsätt.-tillv.</small><b>${s.rg==null?"–":s.rg+"%"}</b></div><div><small>P/E</small><b>${s.pe??"–"}</b></div></div>
  <h4>Teknik</h4><div class="k">${s.a200?"✅":"❌"} Över SMA200 · ${s.a50?"✅":"❌"} Över SMA50 · RSI ${s.rsi} · volym ${s.vx}× snitt · MACD ${s.macd>0?"upp":"ner"}</div>${s.sh?`<div class="mu">⚠ Kort kurshistorik (${s.nb} handelsdagar) – SMA200 saknas.</div>`:""}
  <h4 data-i="dag">Daghandelsfilter (${n}/5) <span class="ii">ⓘ</span></h4>${crit.map((c,j)=>`<div class="k">${s.dt[j]==null?"➖":s.dt[j]?"✅":"⬜"} ${c}</div>`).join("")}${na?'<div class="mu">➖ = kan inte bedömas (ingen pre-market-data för börsen, eller före öppning).</div>':""}
  <h4 data-i="hz">Placeringshorisont <span class="ii">ⓘ</span></h4><div class="k">${hz(s.h)} <span class="mu">${esc(s.hr)}</span></div>

const F=" <p class='mu'>Modell – inte en prognos eller finansiell rådgivning.</p>";
const INFO={
score:()=>["Snittpoäng","<p>Medelvärdet av momentumpoängen (0–100) för de "+H.n+" aktierna i topplistan. Nu: <b>"+f(H.av,1)+"</b>.</p><p>Poängen väger <b>teknik 60 %</b> (avkastning 1 och 3 mån, SMA50/200, MACD, volym), <b>fundamentals 25 %</b> (vinst- och omsättningstillväxt, marginal) och <b>nyheter 15 %</b>.</p><p>Högt tal = starkt momentum brett i toppen. Lågt tal = även de bästa aktierna är svaga.</p><p>Pillen visar medelrörelsen sedan gårdagens stängning: <b>"+sg(H.cg)+"</b>.</p>"+F],
graf:()=>["Poängkurvan","<p>Grafen är <b>inte en kurs över tid</b>. Varje punkt är en aktie i rankingen, från plats 25 längst till vänster till <b>plats 1 längst till höger</b> (den ljusa punkten).</p><p><b>Brant mot slutet:</b> få aktier sticker ut. <b>Jämn kurva:</b> momentumet är brett och många ligger nära toppen.</p>"],

signaler:()=>["Signaler","<p>Appen flaggar automatiskt när något av följande inträffar:</p><p>📈 <b>SMA50-brott:</b> priset korsar 50-dagars medelvärde upp eller ner – tidigt tecken på trendskifte.</p><p>⚡ <b>RSI:</b> under 30 (översåld, möjlig studs) eller över 70 (överköpt, möjlig rekyl).</p><p>📐 <b>Fibonacci:</b> priset ligger nära en retracement-nivå (23,6/38,2/50/61,8/78,6 %) av senaste halvårets rörelse – vanliga stöd/motstånd.</p><p>🛡️ <b>Graham Screener</b> och ✨ <b>Magic Formula</b>: se Värde-rubriken.</p>"+F],
dag:()=>["Daghandelsfilter","<p>Aktien är en kandidat bara om <b>alla fem</b> kriterier uppfylls:</p><p>1. Pris över gårdagens high<br>2. Gårdagens stängning över SMA200<br>3. Pris över dagens pre-market high<br>4. Pris över dagens öppningskurs<br>5. Pre-market volym ≥ 50 000</p><p>➖ betyder att kriteriet inte kan bedömas (t.ex. svenska aktier saknar pre-market, eller marknaden har inte öppnat än). Dagens kandidater: <b>"+(H.dc||0)+"</b>.</p>"+F],
hz:()=>["Placeringshorisont","<p>Varje aktie får en flagga för vilken tidshorisont som passar bäst just nu, enligt fasta regler i skannern:</p><p><b>1–3 mån:</b> starkt kortsiktigt momentum (stark 1–3 mån-avkastning, över SMA50, MACD uppåt).</p><p><b>3–6 mån:</b> etablerad uppåttrend över SMA50 och SMA200.</p><p><b>6–12 mån:</b> trenden håller och vinst/omsättning växer.</p><p><b>1–2 år:</b> värdecase (Magic Formula/Graham) med trend som håller.</p><p><b>2+ år:</b> Graham-värde utan trendbekräftelse – kräver tålamod.</p><p><b>Avvakta:</b> ingen tydlig setup just nu.</p>"+F],
val:()=>["Graham &amp; Magic Formula","<p>🛡️ <b>Graham Screener</b> (6 kriterier, minst 5 krävs): P/E &lt; 15, P/B &lt; 1,5, P/E×P/B &lt; 22,5, skuldsättning (D/E) &lt; 100 %, kassalikviditet ≥ 1,5 och positiv vinsttillväxt.</p><p>✨ <b>Magic Formula</b> (Greenblatt): aktierna rankas på <i>earnings yield</i> (EBITDA/företagsvärde) och <i>avkastning på kapital</i> (här approximerat med avkastning på tillgångar). Den bästa kombinerade rankingen på respektive börs – topp 20 % – flaggas. Finans och kraftbolag utesluts, som i originalmetoden.</p><p>Värdelistan (topp 25) rankas på kombinerad värdepoäng och innehåller alla kvalificerade aktier på börsen – inte bara de som ligger i momentumlistan.</p>"+F],
psig:()=>["Portföljsignaler","<p>Varje innehav granskas dagligen mot teknisk och fundamental analys:</p><p><b>SÄLJ:</b> minst två varningar (t.ex. under SMA200, under SMA50 med negativ MACD, RSI &gt; 78, låg momentumpoäng, kraftigt tapp, stor förlust eller överköpt efter stor vinst).</p><p><b>OMFÖRDELA:</b> innehavet väger över 30 % av portföljen.</p><p><b>BEVAKA:</b> en varningssignal.</p><p><b>KÖP MER:</b> minst tre positiva signaler (hög momentumpoäng, trend, Fibonacci i upptrend, översåld i upptrend, Graham/Magic Formula, växande vinst).</p><p><b>BEHÅLL:</b> inga tydliga signaler.</p>"+F]

function parseCSV(t){t=t.replace(/^\uFEFF/,"");const first=t.split(/\r?\n/).find(l=>l.trim())||"";const d=[";","\t",","].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=ch}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
const numSE=s=>{s=String(s==null?"":s).replace(/[\s\u00a0]/g,"").replace(/[^\d,.\-]/g,"");if(s.indexOf(",")>=0&&s.indexOf(".")>=0)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(",",".");const n=parseFloat(s);return isNaN(n)?null:n};
const KW={name:["namn","vardepapper","instrument","benamning","security","name","aktie"],isin:["isin"],tick:["ticker","symbol","kortnamn"],qty:["antal","quantity","volym","qty"],px:["gav","anskaffningskurs","snittkurs","inkopskurs","kurs","pris","price","avg","anskaffningsvarde"],date:["datum","date","affarsdag","handelsdag","likviddag"],type:["transaktionstyp","handelstyp","typ","action","affar"]};
let IMP={rows:[],hdr:[],map:{},sel:[]};
function guessMap(hdr){const m={};Object.keys(KW).forEach(k=>{let best=-1;hdr.forEach((h,i)=>{const n=norm(h);if(KW[k].some(w=>n===w||n.includes(w))&&best<0)best=i});m[k]=best});return m}
function matchRow(name,tick,isin){const out=[];if(tick){const t=String(tick).trim().toUpperCase();const hit=SL.find(s=>s.t.toUpperCase()===t||s.d.toUpperCase()===t);if(hit)out.push(hit)}
  const toks=norm(name).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!/^(ab|publ|inc|corp|ltd|class|ser|series)$/.test(w));
  if(toks.length){SL.forEach(s=>{const k=s._k,sc=toks.filter(w=>k.includes(w)).length/toks.length;if(sc>=.5&&!out.includes(s))out.push([sc+(norm(s.n).startsWith(toks[0])?.2:0),s])});}
  const a=out.filter(x=>Array.isArray(x)).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);return out.filter(x=>!Array.isArray(x)).concat(a).slice(0,4)}

  <input type="file" id="impf" accept=".csv,.txt,.tsv,text/csv,text/plain"><label class="fld" style="margin-top:8px"><span>…eller klistra in innehållet</span><textarea id="impt" placeholder="Namn;Antal;GAV;…"></textarea></label>

    IMP.items.push({name:g(r,"name"),tick:g(r,"tick"),q:Math.abs(q),px,date:/^\d{4}-\d{2}-\d{2}/.test(g(r,"date").trim())?g(r,"date").trim().slice(0,10):todayISO(),sell,cands:matchRow(g(r,"name"),g(r,"tick"))})});

   ${IMP.mode==="hold"?'<label class="chip on" id="impr" style="margin:10px 0">✓ Ta bort innehav som inte finns i filen</label>':""}
   <button class="btn wide" id="impgo" style="margin-top:8px">Importera till portföljen</button>`;
  let rem=IMP.mode==="hold";const rb=$("#impr");if(rb)rb.onclick=()=>{rem=!rem;rb.classList.toggle("on",rem);rb.textContent=(rem?"✓ ":"")+"Ta bort innehav som inte finns i filen"};
  $("#impgo").onclick=()=>{const p=getP(IMP.pid);if(!p)return;let n=0;const ch=$$("#impx select[data-r]").map(s=>[IMP.items[+s.dataset.r],s.value]).filter(x=>x[1]);
    if(IMP.mode==="tx"){ch.sort((a,b)=>a[0].date<b[0].date?-1:1).forEach(([it,t])=>{const s=S[t],px=it.px!=null?it.px:(s?s.px:0);if(!(px>0))return;it.sell?sellHolding(p,t,it.q,px,it.date):addHolding(p,t,it.q,px,it.date);n++})}
    else{const keep=new Set();ch.forEach(([it,t])=>{const s=S[t],px=it.px!=null?it.px:(s?s.px:0);if(!(px>0))return;keep.add(t);const h=p.h.find(x=>x.t===t);if(h){h.q=it.q;h.c=px}else p.h.push({t,q:it.q,c:px,d:todayISO()});n++});if(rem)p.h=p.h.filter(h=>keep.has(h.t))}
    save();snapshot();closeSheet();toast(n+" rader importerade");route(true)}
}

function liveSim(x){
